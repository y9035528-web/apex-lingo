name: Build Android APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App Artifact
        run: |
          mkdir -p build
          cp index.html style.css script.js build/ 2>/dev/null || cp * build/

      - name: Archive APK Output
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Lingo-APK
          path: build/
